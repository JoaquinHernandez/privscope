[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "privscope"
version = "1.0.0"
authors = [
  { name="Your Name", email="your.email@example.com" },
]
description = "A modular, zero-dependency Linux privilege escalation & security auditing engine."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
]

[project.scripts]
privscope = "privscope.cli:main"
